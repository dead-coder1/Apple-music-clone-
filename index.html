<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Booo!! Music</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.youtube.com/iframe_api"></script>
    <style>
        :root {
            --easing: cubic-bezier(0.22, 1, 0.36, 1);
            --glass: linear-gradient(135deg, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0.04));
            --glass-border: rgba(255, 255, 255, 0.24);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; }
        body { background: #040407; color: #fff; overflow: hidden; height: 100vh; width: 100vw; }

        /* Hidden Audio Core */
        #hiddenAudioCore { position: fixed; top: -9999px; left: -9999px; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

        /* --- AMBIENT COLOR FLOW BACKGROUND --- */
        .ambient-bg {
            position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;
            background: #050509;
        }
        .amb-orb {
            position: absolute; border-radius: 50%; filter: blur(70px); opacity: 0.55;
            background-size: cover; background-position: center;
            animation: ambientFloat 16s infinite alternate ease-in-out;
            transition: background-image 1.2s ease, background-color 1.2s ease;
        }
        .orb-1 { width: 340px; height: 340px; top: -12%; left: -12%; background-color: #ff2d55; }
        .orb-2 { width: 380px; height: 380px; bottom: -15%; right: -12%; background-color: #5e5ce6; animation-delay: -5s; }
        .orb-3 { width: 280px; height: 280px; top: 38%; left: 20%; background-color: #bf5af2; animation-delay: -9s; opacity: 0.35; }

        @keyframes ambientFloat {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); }
            50% { transform: translate(45px, -35px) scale(1.2) rotate(90deg); }
            100% { transform: translate(-35px, 40px) scale(0.95) rotate(180deg); }
        }

        /* --- STARTUP LIQUID GLASS NOTICE (DEVELOPED BY DEADVISHAAL) --- */
        #startupNotice {
            position: fixed; top: 24px; left: 50%; transform: translate(-50%, -160%) scale(0.85);
            z-index: 9999; padding: 13px 24px; border-radius: 26px;
            background: linear-gradient(135deg, rgba(255,255,255,0.22), rgba(255,255,255,0.06));
            backdrop-filter: blur(28px) saturate(200%); -webkit-backdrop-filter: blur(28px) saturate(200%);
            border: 1px solid rgba(255,255,255,0.35);
            box-shadow: 0 18px 40px rgba(0,0,0,0.6), inset 0 1px 2px rgba(255,255,255,0.5);
            display: flex; align-items: center; gap: 10px; white-space: nowrap;
            transition: transform 0.65s var(--easing), opacity 0.5s ease;
            opacity: 0; pointer-events: none;
        }
        #startupNotice.show { transform: translate(-50%, 0) scale(1); opacity: 1; }
        .glow-dot { width: 9px; height: 9px; border-radius: 50%; background: #ff2d55; box-shadow: 0 0 12px #ff2d55; animation: blink 1.4s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(1.4); } }
        #startupNotice span { font-size: 13.5px; font-weight: 600; color: #fff; letter-spacing: 0.3px; }
        #startupNotice b { background: linear-gradient(90deg, #fff, #ff9f0a, #ff2d55); -webkit-background-clip: text; color: transparent; font-weight: 800; }

        /* --- TOP BAR WITH LIQUID GLASS "Booo!!" BOX --- */
        .top-navbar {
            position: fixed; top: 0; left: 0; width: 100%; z-index: 40;
            padding: 16px 20px 12px; display: flex; justify-content: space-between; align-items: center;
            background: linear-gradient(180deg, rgba(5,5,9,0.85) 0%, rgba(5,5,9,0) 100%);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        }
        .booo-liquid-box {
            padding: 8px 18px; border-radius: 18px;
            background: var(--glass);
            backdrop-filter: blur(25px) saturate(190%); -webkit-backdrop-filter: blur(25px) saturate(190%);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 24px rgba(0,0,0,0.4), inset 0 1px 2px rgba(255,255,255,0.4);
            font-size: 21px; font-weight: 900; letter-spacing: -0.5px;
            background-clip: padding-box;
            display: flex; align-items: center; gap: 6px;
        }
        .booo-liquid-box span {
            background: linear-gradient(135deg, #fff 0%, #ffd60a 50%, #ff2d55 100%);
            -webkit-background-clip: text; color: transparent;
        }
        .support-pill {
            padding: 8px 14px; border-radius: 18px;
            background: var(--glass);
            backdrop-filter: blur(25px) saturate(190%); -webkit-backdrop-filter: blur(25px) saturate(190%);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 20px rgba(0,0,0,0.35), inset 0 1px 1px rgba(255,255,255,0.3);
            display: flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 700;
            cursor: pointer; transition: transform 0.2s;
        }
        .support-pill:active { transform: scale(0.93); }
        .support-pill i { font-size: 16px; background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); -webkit-background-clip: text; color: transparent; }

        /* --- MAIN APP CONTAINER (HOME + SEARCH) --- */
        .main-scroll {
            position: relative; z-index: 10; height: 100vh; overflow-y: auto;
            padding: 78px 20px 155px; scroll-behavior: smooth;
        }
        .main-scroll::-webkit-scrollbar { display: none; }

        /* Search Input Bar */
        .search-box {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255,255,255,0.15); border-radius: 16px;
            padding: 10px 14px; display: flex; align-items: center; margin-bottom: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.25);
        }
        .search-box i { color: rgba(255,255,255,0.5); font-size: 15px; }
        .search-box input {
            flex: 1; background: transparent; border: none; color: #fff;
            font-size: 15.5px; margin-left: 10px; outline: none;
        }
        .search-box input::placeholder { color: rgba(255,255,255,0.42); }
        .search-go {
            background: linear-gradient(135deg, #ff2d55, #bf5af2); border: none; color: #fff;
            padding: 7px 14px; border-radius: 10px; font-weight: 700; font-size: 12.5px; cursor: pointer;
        }

        /* Apple Music Home Sections */
        .section-heading {
            font-size: 21px; font-weight: 800; margin-bottom: 14px; letter-spacing: -0.4px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .section-sub { font-size: 12px; color: rgba(255,255,255,0.5); font-weight: 600; }

        /* Horizontal Featured Cards (Top Picks) */
        .featured-scroll {
            display: flex; gap: 16px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 26px;
        }
        .featured-scroll::-webkit-scrollbar { display: none; }
        .featured-card {
            min-width: 230px; height: 270px; border-radius: 22px; overflow: hidden;
            position: relative; cursor: pointer; flex-shrink: 0;
            border: 1px solid rgba(255,255,255,0.16);
            box-shadow: 0 15px 35px rgba(0,0,0,0.45); transition: transform 0.25s;
        }
        .featured-card:active { transform: scale(0.96); }
        .featured-card img { width: 100%; height: 100%; object-fit: cover; }
        .featured-overlay {
            position: absolute; inset: 0;
            background: linear-gradient(180deg, rgba(0,0,0,0.05) 40%, rgba(0,0,0,0.88) 100%);
            display: flex; flex-direction: column; justify-content: flex-end; padding: 16px;
        }
        .featured-tag { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; color: #ff2d55; margin-bottom: 4px; }
        .featured-overlay h3 { font-size: 17px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .featured-overlay p { font-size: 13px; color: rgba(255,255,255,0.7); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Horizontal Square Album Carousel */
        .carousel-scroll {
            display: flex; gap: 14px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 26px;
        }
        .carousel-scroll::-webkit-scrollbar { display: none; }
        .album-card { width: 135px; flex-shrink: 0; cursor: pointer; transition: transform 0.2s; }
        .album-card:active { transform: scale(0.95); }
        .album-card img {
            width: 135px; height: 135px; border-radius: 16px; object-fit: cover;
            margin-bottom: 7px; border: 1px solid rgba(255,255,255,0.12);
            box-shadow: 0 10px 22px rgba(0,0,0,0.4);
        }
        .album-card h4 { font-size: 13.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .album-card p { font-size: 12px; color: rgba(255,255,255,0.55); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Vertical Song List (Suggested / Search Results) */
        .song-row {
            display: flex; align-items: center; padding: 10px 12px; margin-bottom: 10px;
            border-radius: 16px; background: rgba(255,255,255,0.05);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.08); cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }
        .song-row:active { transform: scale(0.98); background: rgba(255,255,255,0.12); }
        .song-row img { width: 52px; height: 52px; border-radius: 12px; margin-right: 14px; object-fit: cover; }
        .song-meta { flex: 1; overflow: hidden; }
        .song-meta h4 { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 3px; }
        .song-meta p { font-size: 13px; color: rgba(255,255,255,0.55); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .play-circle {
            width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.1);
            display: flex; align-items: center; justify-content: center; font-size: 12px; color: #fff;
        }

        /* Support Us Footer Banner on Home */
        .support-card {
            margin-top: 22px; padding: 18px; border-radius: 22px;
            background: var(--glass);
            backdrop-filter: blur(25px) saturate(180%); -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid var(--glass-border);
            text-align: center; box-shadow: 0 12px 30px rgba(0,0,0,0.4);
        }
        .support-card h4 { font-size: 15px; font-weight: 800; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; gap: 7px; }
        .support-card h4 i { font-size: 18px; color: #ff2d55; }
        .insta-grid { display: flex; gap: 10px; }
        .insta-chip {
            flex: 1; padding: 11px 10px; border-radius: 14px;
            background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.16);
            color: #fff; text-decoration: none; font-size: 13px; font-weight: 700;
            display: flex; align-items: center; justify-content: center; gap: 6px;
        }
        .insta-chip i { font-size: 16px; background: linear-gradient(45deg, #f09433, #dc2743, #bc1888); -webkit-background-clip: text; color: transparent; }

        /* --- SUPPORT US MODAL --- */
        #supportModal {
            position: fixed; inset: 0; z-index: 600;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease; padding: 24px;
        }
        #supportModal.active { opacity: 1; pointer-events: auto; }
        .modal-glass {
            width: 100%; max-width: 320px; padding: 26px 22px; border-radius: 28px;
            background: linear-gradient(145deg, rgba(255,255,255,0.16), rgba(255,255,255,0.04));
            backdrop-filter: blur(35px) saturate(200%); -webkit-backdrop-filter: blur(35px) saturate(200%);
            border: 1px solid rgba(255,255,255,0.28);
            box-shadow: 0 25px 50px rgba(0,0,0,0.65), inset 0 1px 2px rgba(255,255,255,0.4);
            text-align: center;
        }
        .modal-btn {
            display: flex; align-items: center; justify-content: space-between;
            width: 100%; padding: 14px 18px; margin-bottom: 12px; border-radius: 16px;
            background: rgba(255,255,255,0.09); border: 1px solid rgba(255,255,255,0.16);
            color: #fff; text-decoration: none; font-weight: 700; font-size: 15px;
        }
        .modal-btn i.fa-instagram { font-size: 20px; background: linear-gradient(45deg, #f09433, #dc2743, #bc1888); -webkit-background-clip: text; color: transparent; }

        /* --- MINI PLAYER --- */
        #miniPlayer {
            position: fixed; bottom: 14px; left: 14px; right: 14px; height: 64px;
            background: linear-gradient(135deg, rgba(45,45,55,0.8), rgba(20,20,28,0.9));
            backdrop-filter: blur(30px) saturate(200%); -webkit-backdrop-filter: blur(30px) saturate(200%);
            border: 1px solid rgba(255,255,255,0.2); border-radius: 20px;
            display: flex; align-items: center; padding: 0 14px; z-index: 50;
            transform: translateY(150%); transition: transform 0.45s var(--easing);
            cursor: pointer; box-shadow: 0 15px 35px rgba(0,0,0,0.65);
        }
        #miniPlayer.active { transform: translateY(0); }
        #mCover { width: 46px; height: 46px; border-radius: 12px; margin-right: 12px; object-fit: cover; }

        /* --- FULL SCREEN PLAYER (AMBIENT COLOR FLOW) --- */
        #fullPlayer {
            position: fixed; inset: 0; z-index: 200;
            transform: translateY(100%); transition: transform 0.55s var(--easing);
            display: flex; flex-direction: column;
            background: rgba(6, 6, 10, 0.78); backdrop-filter: blur(50px) saturate(190%); -webkit-backdrop-filter: blur(50px) saturate(190%);
            overflow: hidden;
        }
        #fullPlayer.active { transform: translateY(0); }

        .player-ambient-layer { position: absolute; inset: 0; z-index: -1; overflow: hidden; }
        .flow-orb {
            position: absolute; width: 140%; height: 140%; top: -20%; left: -20%;
            background-size: cover; background-position: center;
            filter: blur(65px) saturate(220%) brightness(0.5);
            animation: spinFlow 18s infinite linear;
            transition: background-image 0.8s ease;
        }
        .flow-orb.two {
            width: 120%; height: 120%; top: 5%; left: -10%;
            filter: blur(80px) saturate(250%) brightness(0.42) hue-rotate(40deg);
            animation: spinFlowRev 24s infinite linear; opacity: 0.75;
        }
        @keyframes spinFlow { 0% { transform: rotate(0deg) scale(1.1); } 50% { transform: rotate(180deg) scale(1.28); } 100% { transform: rotate(360deg) scale(1.1); } }
        @keyframes spinFlowRev { 0% { transform: rotate(360deg) scale(1.15); } 50% { transform: rotate(180deg) scale(1.05); } 100% { transform: rotate(0deg) scale(1.15); } }

        .player-top-bar {
            padding: 18px 22px 8px; display: flex; justify-content: space-between; align-items: center; z-index: 5;
        }
        .drag-pill { width: 42px; height: 5px; background: rgba(255,255,255,0.38); border-radius: 5px; cursor: pointer; }

        .art-box {
            width: 78%; max-width: 310px; aspect-ratio: 1/1; margin: 16px auto;
            border-radius: 24px; overflow: hidden;
            box-shadow: 0 25px 60px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.15);
            transition: transform 0.5s var(--easing);
        }
        .art-box.playing { transform: scale(1.04); }
        .art-box img { width: 100%; height: 100%; object-fit: cover; }

        .player-controls-area { padding: 0 28px; margin-top: auto; margin-bottom: 34px; z-index: 5; }
        .track-header h2 { font-size: 23px; font-weight: 800; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .track-header p { font-size: 16px; color: rgba(255,255,255,0.68); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }

        .scrub-zone { margin: 22px 0; padding: 6px 0; cursor: pointer; }
        .scrub-bg { width: 100%; height: 6px; background: rgba(255,255,255,0.22); border-radius: 6px; overflow: hidden; }
        .scrub-fill { width: 0%; height: 100%; background: #fff; border-radius: 6px; box-shadow: 0 0 10px #fff; }
        .scrub-time { display: flex; justify-content: space-between; font-size: 12px; color: rgba(255,255,255,0.58); margin-top: 8px; font-weight: 600; }

        .main-transport { display: flex; justify-content: space-between; align-items: center; padding: 0 20px; margin-bottom: 24px; }
        .main-transport i { font-size: 30px; color: #fff; cursor: pointer; transition: transform 0.15s; }
        .main-transport i:active { transform: scale(0.85); }
        .main-transport .big-play { font-size: 46px; }

        .player-bottom-dock {
            display: flex; justify-content: space-between; align-items: center;
            padding: 11px 22px; border-radius: 20px;
            background: var(--glass); border: 1px solid var(--glass-border);
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
        }
        .dock-item { font-size: 13.5px; font-weight: 700; color: #fff; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .dock-item i.fa-instagram { font-size: 17px; background: linear-gradient(45deg, #f09433, #dc2743, #bc1888); -webkit-background-clip: text; color: transparent; }

        /* --- WORD-BY-WORD LIVE LYRICS OVERLAY --- */
        #lyricsView {
            position: absolute; inset: 0; z-index: 120;
            background: rgba(5, 5, 10, 0.62); backdrop-filter: blur(55px) saturate(190%); -webkit-backdrop-filter: blur(55px) saturate(190%);
            display: flex; flex-direction: column; opacity: 0; pointer-events: none; transition: opacity 0.4s ease;
        }
        #lyricsView.active { opacity: 1; pointer-events: auto; }
        #lyricsBox { flex: 1; overflow-y: auto; padding: 90px 24px 50vh; scroll-behavior: smooth; }
        #lyricsBox::-webkit-scrollbar { display: none; }

        .lyric-line {
            font-size: 27px; font-weight: 800; margin-bottom: 24px; line-height: 1.35;
            transform-origin: left; transition: transform 0.35s var(--easing), opacity 0.35s ease, filter 0.35s ease;
            opacity: 0.35; filter: blur(0.6px);
        }
        .lyric-line.active { transform: scale(1.04); opacity: 1; filter: blur(0px); }
        .lyric-word {
            display: inline-block; margin-right: 7px;
            --wfill: 0%;
            background: linear-gradient(90deg, #fff var(--wfill), rgba(255,255,255,0.25) var(--wfill));
            -webkit-background-clip: text; color: transparent;
            transition: transform 0.15s ease;
        }
        .lyric-word.sung { transform: translateY(-2px); }
    </style>
</head>
<body>

    <!-- STEALTH STREAM CORE -->
    <div id="hiddenAudioCore"><div id="ytPlayer"></div></div>

    <!-- AMBIENT COLOR FLOW BACKGROUND -->
    <div class="ambient-bg">
        <div
